<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="Fontory 로그인 없이 폰트를 미리보는 프리뷰 페이지">
  <title>Fontory · 폰트 미리보기</title>
  <link rel="stylesheet" href="./styles.css?v=20260929-footer1">
  <link rel="stylesheet" href="./preview.css?v=20260929-title-loop1">
</head>
<body>
  <div class="app-shell preview-shell">
    <header class="hero">
      <div class="topbar">
        <span class="eyebrow">FONTORY · PREVIEW ONLY</span>
        <div class="preview-top-actions">
          <button class="theme" id="themeBtn" type="button" aria-label="다크 모드 전환">◐</button>
          <a class="preview-login" href="./">로그인</a>
        </div>
      </div>
      <h1 id="previewTitle" class="preview-title" aria-label="Fontory Preview."><span id="previewTitleBrand"></span><span id="previewTitleWord"></span></h1>
      <p>로그인 없이 폰트를 검색하고 실제 글꼴 모양을 미리볼 수 있습니다.</p>
      <div class="search-wrap">
        <span aria-hidden="true">⌕</span>
        <input id="previewSearch" type="search" placeholder="폰트 이름 또는 카테고리 검색" autocomplete="off">
      </div>
      <div id="previewCategories" class="category-bar" role="tablist" aria-label="카테고리"></div>
    </header>
    <main>
      <section class="preview-notice">
        <strong>프리뷰 전용</strong>
        <span>원본 파일 다운로드와 설치는 로그인 후 사용할 수 있습니다.</span>
      </section>
      <div id="previewStatus" class="status-banner" hidden></div>
      <div class="section-head">
        <h2>Fonts</h2>
        <span id="previewCount">0 fonts</span>
      </div>
      <section id="previewGrid" class="font-grid" aria-live="polite"></section>
      <p id="previewEmpty" class="empty" hidden>검색 결과가 없습니다.</p>
      <nav id="previewPagination" class="pagination" aria-label="프리뷰 폰트 목록 페이지"></nav>
    </main>
    <footer>
      <p>Fontory · datatronics</p>
      <p class="small">프리뷰 페이지에서는 파일을 다운로드하지 않습니다.</p>
      <nav class="site-footer-links" aria-label="사이트 안내"><span>기타 로그인</span><span>사이트 문의사항</span></nav>
    </footer>
  </div>
  <script src="./preview.js?v=20260929-title-loop1"></script>
  <script src="./background-effects.js?v=20260929-ambient1"></script>
</body>
</html>
