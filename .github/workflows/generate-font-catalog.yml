name: Generate font catalog

on:
  push:
    paths:
      - 'fonts/**'
      - '.github/workflows/generate-font-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build fonts.json
        run: |
          python3 - <<'PY'
          import json, os, re
          root='fonts'; exts={'.ttf','.otf','.woff','.woff2'}; files=[]
          for base, _, names in os.walk(root):
              for name in names:
                  if os.path.splitext(name)[1].lower() in exts:
                      files.append(os.path.join(base,name).replace(os.sep,'/'))
          files.sort(key=str.lower)
          def category(path):
              s=path.lower()
              if '배달의민족' in s or '/bm' in s or s.startswith('bm'): return '배달의민족'
              if any(k in s for k in ['독립','kcc','kim-gu','ahn jung','yoon-dong','yun-bong','han-yong']): return '독립서체'
              if any(k in s for k in ['nanum','나눔','koddi','noto']): return '기본 한국폰트'
              if any(k in s for k in ['tmoney','roundwind','둥근','doldam','kokkoma']): return '귀여운 둥근폰트'
              return '개성폰트'
          def display(name):
              return re.sub(r'[_-]+',' ',os.path.splitext(name)[0]).strip()
          catalog=[{'name':display(os.path.basename(p)),'category':category(p),'preview':'오늘도 예쁘게 기록해요 · Aa 가나다 123','description':'iPhone 폰트 라이브러리','file':'./'+p} for p in files]
          with open('fonts.json','w',encoding='utf-8') as f: json.dump(catalog,f,ensure_ascii=False,indent=2)
          print(f'Generated {len(catalog)} fonts')
          PY
      - name: Commit catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fonts.json
          if git diff --cached --quiet; then echo 'No catalog changes.'; else git commit -m 'chore: generate font catalog'; git push; fi
